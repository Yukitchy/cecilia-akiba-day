<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Akihabara evening, three capsules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1a17; --bg:#fdf7ee; --paper:#fff; --muted:#5c544c;
  --red:#d7261e; --pink:#e2559b; --blue:#2a6fdb;
  --display:"Fraunces",Georgia,serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);overflow-x:hidden}
h1,h2,h3{font-family:var(--display);font-weight:900;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.print-only{display:none}

/* hero grid */
.stage{display:grid;gap:28px;padding:28px 0 40px}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(30px,8.4vw,50px);margin:8px 0 12px}
h1 span{display:block}
.lead{max-width:34em;color:#3a342e}

/* machine */
.machine{position:relative;width:min(100%,300px);margin:24px auto 8px}
.machine svg.body{display:block;width:100%;height:auto}
.handle{position:absolute;left:50%;top:68.1%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);
  border:0;border-radius:50%;background:transparent;padding:0;cursor:pointer}
.handle svg{width:100%;height:100%;display:block}
.handle:focus-visible{outline-offset:2px;outline-color:#fff;box-shadow:0 0 0 6px var(--ink)}
.handle .knob{transform-origin:50% 50%}
.machine.turning .knob{animation:turn .7s ease-in-out}
.machine.turning .dome-caps{animation:shake .5s ease-in-out}
.prize{position:absolute;left:50%;top:87%;width:14%;aspect-ratio:1;border-radius:50%;
  transform:translate(-50%,-50%);opacity:0;border:3px solid var(--ink);
  background:linear-gradient(#fff 0 0) bottom/100% 50% no-repeat,var(--c,#fff)}
.machine.dropping .prize{animation:drop .6s cubic-bezier(.5,0,.9,.6) both}
.machine.has-prize:not(.dropping) .prize{opacity:1}
.hint{text-align:center;font-size:14px;color:var(--muted)}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes drop{0%{opacity:1;transform:translate(-50%,-340%)}70%{opacity:1;transform:translate(-50%,-50%)}85%{transform:translate(-50%,-70%)}100%{opacity:1;transform:translate(-50%,-50%)}}

/* capsule buttons */
.caps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.cap{display:flex;flex-direction:column;align-items:center;gap:10px;border:0;background:none;padding:6px 2px;
  color:var(--ink);font:600 14px/1.25 var(--body);cursor:pointer;text-align:center}
.cap .ball{position:relative;width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);
  background:linear-gradient(#fff 0 0) bottom/100% 50% no-repeat,var(--c);display:grid;place-items:center;
  transition:transform .15s}
.cap .ball::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--ink)}
.cap .ball b{position:relative;z-index:1;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;
  background:#fff;border:3px solid var(--ink);font:900 20px/1 var(--display)}
.cap:hover .ball{transform:translateY(-3px)}
.cap[aria-pressed="true"] .ball{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--c)}
.cap[aria-pressed="true"]{font-weight:700}
.cap span.n{max-width:11em;text-wrap:balance}

/* prize card */
.card{--t:color-mix(in srgb,var(--c) 11%,#fff);background:var(--paper);border:5px solid var(--c);border-radius:24px;
  overflow:hidden;box-shadow:8px 8px 0 var(--c)}
.card[hidden]{display:none}
.card.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.card figure{margin:0;position:relative;aspect-ratio:16/9;background:var(--t)}
.card figure img{display:block;width:100%;height:100%;object-fit:cover}
.card .stamp{position:absolute;left:12px;bottom:12px;background:var(--c);color:#fff;font:700 12px/1 var(--body);
  letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border-radius:999px;border:2px solid #fff}
.card .head{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;padding:18px 18px 4px}
.badge{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;
  font:900 28px/1 var(--display);grid-row:span 2}
.card h2{font-size:clamp(24px,6vw,34px)}
.tag{justify-self:start;font-size:13px;font-weight:600;border:2px solid var(--c);border-radius:999px;padding:2px 10px;line-height:1.4}
.why{padding:10px 18px 4px;font-size:17px}
ol.steps{list-style:none;counter-reset:s;margin:12px 18px 0;padding:0;border-top:2px dashed color-mix(in srgb,var(--c) 45%,#fff)}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:26px 48px 1fr;gap:0 8px;padding:9px 0;
  border-bottom:1px solid #eee4d6;align-items:baseline}
ol.steps li::before{content:counter(s);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;
  background:var(--c);color:#fff;font:700 12px/1 var(--body);align-self:start;margin-top:2px}
ol.steps time{font-weight:700;font-variant-numeric:tabular-nums}
ol.steps .p{font-weight:600}
ol.steps .w{display:block;font-size:14px;color:var(--muted);line-height:1.45}
.foot{margin-top:14px;background:var(--t);padding:14px 18px 16px;display:grid;gap:8px;font-size:15px}
.foot b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}

/* below */
.info{display:grid;gap:20px;padding-bottom:24px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:20px}
.panel h2{font-size:clamp(22px,5.5vw,30px);margin-bottom:8px}
.panel p+p{margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:14px;padding:0 22px;
  background:var(--ink);color:#fff;border:3px solid var(--ink);border-radius:999px;font:700 16px/1 var(--body);
  text-decoration:none;cursor:pointer}
.btn:hover{background:#fff;color:var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.alt:hover{background:var(--ink);color:#fff}
.save{text-align:center;padding:8px 0 32px}
.save .btn{margin-top:0}
footer{border-top:3px solid var(--ink);padding:20px 0 40px;font-size:14px;color:#3a342e}
footer p+p{margin-top:6px}

@media (min-width:900px){
  .wrap{padding:0 32px}
  .stage{grid-template-columns:5fr 6fr;gap:56px;align-items:start;padding-top:48px}
  .info{grid-template-columns:1fr 1fr;gap:24px}
  .machine{width:min(100%,320px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

@media print{
  @page{size:A4;margin:11mm}
  html,body{background:#fff}
  body{font-size:9pt;line-height:1.3;overflow:visible}
  .no-print,.machine,.hint,.caps,.save,.info .btn{display:none!important}
  .print-only{display:block}
  .wrap{max-width:none;padding:0}
  .stage{display:block;padding:0}
  .print-only h1{font-size:20pt;margin:0 0 2mm}
  .print-only p{margin-bottom:2.5mm}
  #cards{display:grid;gap:3mm}
  .card,.card[hidden]{display:grid!important;grid-template-columns:48mm 1fr;box-shadow:none;border-width:2.5pt;border-radius:10px;break-inside:avoid;animation:none}
  .card figure{aspect-ratio:auto;grid-row:span 4;height:100%}
  .card .stamp{display:none}
  .card .head{padding:2mm 4mm 0}
  .badge{width:9mm;height:9mm;font-size:14pt}
  .card h2{font-size:14pt}
  .why{padding:1.5mm 4mm 0;font-size:9pt}
  ol.steps{margin:1mm 4mm 0;grid-column:2}
  ol.steps li{padding:.5mm 0;grid-template-columns:5mm 11mm 1fr}
  ol.steps li::before{width:4.5mm;height:4.5mm;font-size:7pt}
  ol.steps .w{font-size:7.5pt;line-height:1.25}
  .foot{grid-column:1/-1;margin-top:1.5mm;padding:1.5mm 4mm;font-size:8pt;grid-template-columns:1fr 1fr}
  .info{display:grid;grid-template-columns:1fr 1fr;gap:3mm;padding:3mm 0 0;break-inside:avoid}
  .panel{border-width:1.5pt;padding:2mm 4mm}
  .panel h2{font-size:12pt}
  footer{padding:3mm 0 0;font-size:8pt}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="print-only">
    <h1 id="p-title"></h1>
    <p id="p-meta"></p>
  </header>

  <div class="stage">
    <section class="no-print" aria-labelledby="h1">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="h1"><span>Turn the handle.</span> <span>Pick your evening.</span></h1>
      <p class="lead" id="lead"></p>

      <div class="machine" id="machine">
        <svg class="body" viewBox="0 0 260 360" role="img" aria-label="A capsule toy machine with a red, a pink and a blue capsule in the dome">
          <ellipse cx="130" cy="352" rx="108" ry="6" fill="#1d1a17" opacity=".12"/>
          <circle cx="130" cy="104" r="90" fill="#eaf3fb" stroke="#1d1a17" stroke-width="4"/>
          <g class="dome-caps">
            <g transform="translate(130 76)"><circle r="27" fill="#fff" stroke="#1d1a17" stroke-width="3"/><path d="M-27 0A27 27 0 0 1 27 0Z" fill="#e2559b" stroke="#1d1a17" stroke-width="3"/></g>
            <g transform="translate(88 128)"><circle r="27" fill="#fff" stroke="#1d1a17" stroke-width="3"/><path d="M-27 0A27 27 0 0 1 27 0Z" fill="#d7261e" stroke="#1d1a17" stroke-width="3"/></g>
            <g transform="translate(172 128)"><circle r="27" fill="#fff" stroke="#1d1a17" stroke-width="3"/><path d="M-27 0A27 27 0 0 1 27 0Z" fill="#2a6fdb" stroke="#1d1a17" stroke-width="3"/></g>
          </g>
          <path d="M62 62A90 90 0 0 1 112 22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".9"/>
          <rect x="70" y="186" width="120" height="16" fill="#1d1a17"/>
          <rect x="40" y="198" width="180" height="142" rx="20" fill="#d7261e" stroke="#1d1a17" stroke-width="4"/>
          <circle cx="130" cy="245" r="42" fill="#fff" stroke="#1d1a17" stroke-width="4"/>
          <rect x="82" y="296" width="96" height="34" rx="10" fill="#1d1a17"/>
          <rect x="52" y="338" width="156" height="12" rx="6" fill="#1d1a17"/>
        </svg>
        <div class="prize" id="prize" aria-hidden="true"></div>
        <button class="handle" id="handle" type="button" aria-label="Turn the handle to draw a random plan">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <g class="knob">
              <circle cx="50" cy="50" r="46" fill="#fdf7ee" stroke="#1d1a17" stroke-width="5"/>
              <rect x="10" y="40" width="80" height="20" rx="10" fill="#1d1a17"/>
              <circle cx="50" cy="50" r="9" fill="#fdf7ee"/>
            </g>
          </svg>
        </button>
      </div>
      <p class="hint">Tap the handle for a surprise, or pick a capsule.</p>

      <div class="caps" id="caps" role="group" aria-label="Choose a plan"></div>
    </section>

    <div id="cards" aria-live="polite"></div>
  </div>

  <div class="info">
    <section class="panel" aria-labelledby="meet-h">
      <h2 id="meet-h">Where we meet</h2>
      <p id="meet"></p>
      <a class="btn" id="map" href="#" target="_blank" rel="noopener">Open the map</a>
    </section>
    <section class="panel" aria-labelledby="choose-h">
      <h2 id="choose-h">How to choose</h2>
      <p id="reply"></p>
    </section>
  </div>

  <div class="save no-print"><button class="btn alt" type="button" onclick="window.print()">Save as PDF</button></div>
</main>

<footer>
  <div class="wrap">
    <p id="note"></p>
    <p id="credit"></p>
  </div>
</footer>

<script src="../data.js?v=20261013"></script>
<script>
(function(){
  var T = window.TOUR, R = T.routes;
  var COLORS = {A:"var(--red)", B:"var(--pink)", C:"var(--blue)"};
  var $ = function(id){return document.getElementById(id)};
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  $("eyebrow").textContent = "For " + T.guest + " · " + T.day;
  $("lead").textContent = "Three hours in Akihabara, " + T.time.replace(" to ", " to ") + ", with sunset at " + T.sunset + ". Three capsules, three evenings. Open one.";
  $("p-title").textContent = "Your Akihabara evening, " + T.guest;
  $("p-meta").textContent = T.day + " · " + T.time + " · Start: " + T.start;
  $("meet").textContent = T.meet;
  $("map").href = T.map;
  $("reply").textContent = T.reply;
  $("note").textContent = T.note;
  $("credit").innerHTML = T.credit;

  var caps = $("caps"), cards = $("cards");
  R.forEach(function(r){
    var c = COLORS[r.id];
    var b = document.createElement("button");
    b.type = "button"; b.className = "cap"; b.style.setProperty("--c", c);
    b.dataset.id = r.id; b.setAttribute("aria-pressed","false"); b.setAttribute("aria-controls","card-"+r.id);
    b.innerHTML = '<span class="ball" aria-hidden="true"><b>'+r.id+'</b></span><span class="n">'+r.name+'</span>';
    b.setAttribute("aria-label","Plan "+r.id+": "+r.name);
    b.addEventListener("click", function(){ show(r.id, true); });
    caps.appendChild(b);

    var el = document.createElement("article");
    el.className = "card"; el.id = "card-"+r.id; el.hidden = true; el.style.setProperty("--c", c);
    el.setAttribute("aria-labelledby","t-"+r.id);
    var steps = r.steps.map(function(s){
      return '<li><time>'+s.t+'</time><span><span class="p">'+s.place+'</span><span class="w">'+s.what+'</span></span></li>';
    }).join("");
    el.innerHTML =
      '<figure><img src="../'+r.img+'" alt="'+r.alt+'" loading="eager"><span class="stamp">Prize '+r.id+'</span></figure>'+
      '<div class="head"><span class="badge" aria-hidden="true">'+r.id+'</span><h2 id="t-'+r.id+'">'+r.name+'</h2><span class="tag">'+r.tag+'</span></div>'+
      '<p class="why">'+r.why+'</p>'+
      '<ol class="steps">'+steps+'</ol>'+
      '<div class="foot"><div><b>Best for</b>'+r.good+'</div><div><b>Getting around</b>'+r.moves+'</div></div>';
    cards.appendChild(el);
  });

  var current = null;
  function show(id, animate){
    current = id;
    R.forEach(function(r){
      var open = r.id === id;
      var el = $("card-"+r.id);
      el.hidden = !open;
      el.classList.toggle("pop", open && animate && !reduce);
      caps.querySelector('[data-id="'+r.id+'"]').setAttribute("aria-pressed", open);
    });
  }

  var m = $("machine"), busy = false;
  $("handle").addEventListener("click", function(){
    if(busy) return;
    var others = R.filter(function(r){return r.id !== current;});
    var pick = others[Math.floor(Math.random()*others.length)].id;
    if(reduce){ $("prize").style.setProperty("--c", COLORS[pick]); m.classList.add("has-prize"); show(pick, false); return; }
    busy = true;
    m.classList.remove("dropping","has-prize");
    void m.offsetWidth;
    m.classList.add("turning");
    setTimeout(function(){
      $("prize").style.setProperty("--c", COLORS[pick]);
      m.classList.add("dropping","has-prize");
    }, 600);
    setTimeout(function(){
      m.classList.remove("turning","dropping");
      show(pick, true);
      busy = false;
    }, 1250);
  });

  show("A", false);
})();
</script>
</body>
</html>
