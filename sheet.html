<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Akihabara for Cecilia: one-page sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:0}
:root{--ink:#1d1a17;--grey:#5f5750;--red:#d7261e;--line:#d9cfc0;--bg:#fdf7ee}
*{box-sizing:border-box}
html,body{margin:0;background:#888}
body{font:8.6pt/1.35 "Instrument Sans",system-ui,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;margin:0 auto;background:var(--bg);padding:10mm 10mm 8mm;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:space-between;font-size:7.5pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-bottom:1.5px solid var(--ink);padding-bottom:2mm}
.word{display:block;width:100%;height:auto;margin:2mm 0 1mm}
.sub{display:flex;justify-content:space-between;font-size:9pt;font-weight:600;margin-bottom:2.5mm}
.band{background:var(--red);color:#fff;display:flex;gap:6mm;padding:2.2mm 4mm;font:13pt/1 Anton,sans-serif;letter-spacing:.03em;text-transform:uppercase}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin-top:4mm;flex:1;min-height:0}
.col{display:flex;flex-direction:column;min-width:0}
.col img{width:100%;height:30mm;object-fit:cover;display:block}
.id{display:flex;align-items:baseline;gap:2mm;margin-top:2mm}
.id b{font:22pt/1 Anton,sans-serif;color:var(--red)}
.id h2{font:12.5pt/1.1 Anton,sans-serif;text-transform:uppercase;margin:0;letter-spacing:.01em}
.tag{color:var(--red);font-weight:700;font-size:8pt;margin:1mm 0 1.5mm}
.why{color:var(--grey);margin:0 0 2mm}
ol{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
li{display:grid;grid-template-columns:11mm 1fr;gap:0 2mm;padding:1.3mm 0;border-bottom:.5px solid var(--line);break-inside:avoid}
li .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:9pt}
li .p{font-weight:700}
li .h{color:var(--grey);font-size:7.4pt}
li.sun{display:flex;align-items:center;gap:2mm;color:var(--red);font-weight:700;font-size:7pt;letter-spacing:.12em;text-transform:uppercase;border-bottom:0;padding:1mm 0}
li.sun:before,li.sun:after{content:"";flex:1;height:1.5px;background:var(--red)}
.best{margin-top:2mm;font-size:7.8pt}.best b{color:var(--red);text-transform:uppercase;letter-spacing:.08em;font-size:7pt;display:block}
.foot{display:grid;grid-template-columns:1.3fr 1fr;gap:5mm;border-top:1.5px solid var(--ink);margin-top:3mm;padding-top:2.5mm}
.foot h3{margin:0 0 1mm;font:11pt/1 Anton,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.foot p{margin:0 0 1mm}
.url{font-weight:700;color:var(--red)}
.fine{font-size:6.3pt;color:var(--grey);margin-top:2mm}
@media screen{.page{margin:10mm auto;box-shadow:0 2px 12px rgba(0,0,0,.3)}}
</style>
</head>
<body>
<div class="page">
 <div class="top"><span>Private evening tour for Cecilia</span><span>Guide: Yuuki</span></div>
 <svg class="word" viewBox="0 0 1000 150" preserveAspectRatio="none" aria-label="Akihabara"><text x="0" y="140" textLength="1000" lengthAdjust="spacingAndGlyphs" style="font:150px Anton,sans-serif;fill:#1d1a17">AKIHABARA</text></svg>
 <div class="sub"><span id="day"></span><span>Pick plan A, B or C</span></div>
 <div class="band"><span id="time"></span><span id="sunset"></span><span>On foot</span></div>
 <div class="cols" id="cols"></div>
 <div class="foot">
  <div><h3>Meeting point</h3><p id="meet"></p></div>
  <div><h3>How to choose</h3><p id="reply"></p><p>Full plan with photos and maps:<br><span class="url">yukitchy.github.io/cecilia-akiba-day</span></p></div>
 </div>
 <div class="fine" id="fine"></div>
</div>
<script src="data.js?v=20261013"></script>
<script>
(function(){
 var T=window.TOUR,$=function(i){return document.getElementById(i)};
 function m(t){var p=t.split(':');return +p[0]*60+ +p[1]}
 function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 $('day').textContent=T.day;$('time').textContent=T.time.replace(' to ','–');$('sunset').textContent='Sunset '+T.sunset;
 $('meet').textContent=T.meet;$('reply').textContent=T.reply;
 $('fine').innerHTML=esc(T.note)+' '+esc(T.checked||'')+' '+T.credit;
 var sun=m(T.sunset);
 $('cols').innerHTML=T.routes.map(function(r){
  var done=false,rows=r.steps.map(function(s){
   var sp=T.spots[s.place]||{},out='';
   if(!done&&m(s.t)>=sun){done=true;out+='<li class="sun">Sunset '+T.sunset+'</li>'}
   return out+'<li><span class="t">'+s.t+'</span><span><span class="p">'+esc(sp.name||s.place)+'</span>'+(sp.hours?'<br><span class="h">'+esc(sp.hours)+'</span>':'')+'</span></li>';
  }).join('');
  return '<div class="col"><img src="'+r.img+'" alt="'+esc(r.alt)+'"><div class="id"><b>'+r.id+'</b><h2>'+esc(r.name)+'</h2></div><div class="tag">'+esc(r.tag)+'</div><p class="why">'+esc(r.why)+'</p><ol>'+rows+'</ol><div class="best"><b>Best for</b>'+esc(r.good)+'</div></div>';
 }).join('');
})();
</script>
</body>
</html>
